name: CI

# Suite FPC (Free Pascal): roda em runners hospedados sem licenca do Delphi.
# Build Delphi/GUI continua manual (IDE ou runner self-hosted com RAD Studio).
on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test-fpc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Instalar Free Pascal
        run: sudo apt-get update && sudo apt-get install -y fp-compiler fp-units-fcl fp-units-rtl
      - name: Clonar FPDF-Pascal
        run: git clone --depth 1 https://github.com/Projeto-ACBr-Oficial/FPDF-Pascal.git third_party/FPDF-Pascal
      - name: Testes unitarios (FPC)
        run: sh test-fpc.sh
